<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=3.0, user-scalable=yes">
    <title>Loading...</title>
    <style>
        html, body {
            height: 100%;
            margin: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #f0f0f0, #d9d9d9);
            overflow: hidden;
        }

        .loader-container {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .loader {
            border: 10px solid rgba(255,255,255,0.2);
            border-top: 10px solid #BC0000;
            border-radius: 50%;
            width: 80px;
            height: 80px;
            animation: spin 1s linear infinite;
            box-shadow: 0 0 20px rgba(188, 0, 0, 0.5);
            margin-bottom: 20px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .text {
            text-align: center;
            font-size: 20px;
            color: #333;
            font-weight: 600;
            letter-spacing: 0.5px;
            animation: fadeInOut 2s infinite;
            margin-bottom: 8px;
        }

        .tip {
            font-size: 14px;
            color: #666;
            text-align: center;
            animation: fadeInOut 2s 0.5s infinite;
        }

        @keyframes fadeInOut {
            0%, 100% { opacity: 0.6; }
            50% { opacity: 1; }
        }

        /* Particle dots around loader */
        .particle {
            position: absolute;
            width: 6px;
            height: 6px;
            background: #BC0000;
            border-radius: 50%;
            animation: float 2s infinite ease-in-out;
        }

        @keyframes float {
            0% { transform: translateY(0) translateX(0); opacity: 1; }
            50% { transform: translateY(-15px) translateX(10px); opacity: 0.5; }
            100% { transform: translateY(0) translateX(0); opacity: 1; }
        }
    </style>
</head>
<body>
<div class="loader-container">
    <div class="loader"></div>
    <div class="text">Loading document...</div>
    <div class="tip">Please wait while we fetch the latest content.</div>
</div>
</body>
</html>
